<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLM Validation Playground</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Left: Chat panel -->
    <section class="panel chat-panel">
      <header class="panel-header">
        <div class="panel-header-top">
          <div class="panel-title">
            <span class="pill pill-primary"></span>
            <h1>LLM Chat</h1>
          </div>
          <div class="mode-toggle">
            <button id="btn-chat-mode" class="toggle-btn active">Chat</button>
            <button id="btn-manual-mode" class="toggle-btn">Manual</button>
          </div>
        </div>
        <p id="panel-subtitle" class="panel-subtitle">Ask a question and watch the LLM respond.</p>
      </header>

      <div id="chat-window" class="chat-window">
        <div class="message-row system">
          <div class="message-bubble">
            <p>Welcome! Type a question to chat with the LLM, then the validation pipeline runs automatically.</p>
          </div>
        </div>
      </div>

      <!-- Chat mode input (single question) -->
      <form id="chat-form" class="chat-input-row">
        <div class="chat-inputs">
          <textarea
            id="question-input"
            class="input question-input"
            placeholder="Ask a question..."
            rows="2"
          ></textarea>
        </div>
        <button type="submit" class="btn-primary" id="send-btn">
          Send
        </button>
      </form>

      <!-- Manual mode input (question + answer) -->
      <form id="manual-form" class="chat-input-row hidden">
        <div class="chat-inputs">
          <textarea
            id="manual-question-input"
            class="input question-input"
            placeholder="LLM input (question)..."
            rows="2"
          ></textarea>
          <textarea
            id="manual-answer-input"
            class="input answer-input"
            placeholder="LLM output (answer)..."
            rows="3"
          ></textarea>
        </div>
        <button type="submit" class="btn-primary">
          Validate
        </button>
      </form>
    </section>

    <!-- Right: Validation pipeline panel -->
    <section class="panel pipeline-panel">
      <header class="panel-header">
        <div class="panel-title">
          <span class="pill pill-accent"></span>
          <h1>Validation Pipeline</h1>
        </div>
        <p class="panel-subtitle">Multi-layer checks on the LLM answer.</p>
      </header>

      <div class="pipeline-summary">
        <div class="summary-item">
          <span class="summary-label">Overall score</span>
          <span id="overall-score" class="summary-value">–</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">Last run</span>
          <span id="last-run" class="summary-value">No runs yet</span>
        </div>
      </div>

      <ol id="pipeline-steps" class="timeline">
        <!-- Steps will be populated by JS -->
      </ol>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
